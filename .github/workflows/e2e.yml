# Playwright golden path against the fake ACE-Step — see PLAN.md "Playwright Golden-Path E2E" —
# plus the SCORE spec (F-028) against a fake Ollama and a fake yue-server, on its own server with
# LLM_API_URL set (e2e/playwright.config.ts, project `score`). The fakes are Node; no Python here.
name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            e2e/package-lock.json

      # Every take goes through transcode.ts, which shells out to ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install e2e
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

      - name: Run golden path and SCORE spec
        working-directory: e2e
        run: npm run test:e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
