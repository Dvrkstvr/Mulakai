# Unit tests, typechecks, lint and yue-server pytest (D-033). The Playwright
# golden path runs separately in e2e.yml.
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc -b + vite build)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  yue-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yue-server
    steps:
      - uses: actions/checkout@v7

      # YuE2 pins Python 3.12 (README); the tests use a fake pipeline, so no
      # torch, yue2 or GPU is installed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: yue-server/requirements-test.txt

      - name: Install
        run: pip install -r requirements-test.txt

      - name: Test
        run: python -m pytest
